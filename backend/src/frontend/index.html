<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinmecPrep AI – Chuẩn bị khám thông minh</title>
  <style>
    :root {
      --vinmec-blue: #005baa;
      --vinmec-teal: #00a4bd;
      --bg: #f4f7fb;
      --chat-bg: #fff;
      --user-bubble: #005baa;
      --bot-bubble: #f0f4f8;
      --text: #1a2130;
      --muted: #6b7a8d;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(0,91,170,.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    header {
      width: 100%;
      background: var(--vinmec-blue);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    header .logo {
      width: 36px; height: 36px;
      background: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    header h1 { font-size: 17px; font-weight: 700; }
    header p  { font-size: 12px; opacity: .85; }

    /* Chat area */
    #chat-container {
      flex: 1;
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0 12px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bubble-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .bubble-row.user  { flex-direction: row-reverse; }
    .bubble-row.bot   { flex-direction: row; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--vinmec-teal);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .bubble-row.user .avatar { background: #e0eaf7; }

    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.6;
      white-space: pre-wrap;
      box-shadow: var(--shadow);
    }
    .bubble-row.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble-row.bot .bubble {
      background: var(--bot-bubble);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .bubble strong { font-weight: 700; }
    .bubble em     { font-style: italic; opacity: .85; }

    /* Typing indicator */
    .typing { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
    .typing span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--vinmec-teal);
      animation: bounce .9s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-8px); }
    }

    /* Quick prompts */
    #quick-prompts {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 8px 0;
    }
    .qp-btn {
      background: #fff;
      border: 1.5px solid var(--vinmec-teal);
      color: var(--vinmec-blue);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all .2s;
    }
    .qp-btn:hover { background: var(--vinmec-teal); color: #fff; }

    /* Input area */
    #input-area {
      padding: 12px 0 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #user-input {
      flex: 1;
      border: 1.5px solid #d0dae6;
      border-radius: 24px;
      padding: 12px 18px;
      font-size: 14.5px;
      resize: none;
      max-height: 120px;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
    }
    #user-input:focus { border-color: var(--vinmec-teal); }

    #send-btn {
      width: 46px; height: 46px;
      background: var(--vinmec-blue);
      border: none; border-radius: 50%;
      color: #fff; font-size: 20px;
      cursor: pointer; flex-shrink: 0;
      transition: background .2s;
      display: flex; align-items: center; justify-content: center;
    }
    #send-btn:hover  { background: var(--vinmec-teal); }
    #send-btn:disabled { background: #a0b4c8; cursor: not-allowed; }

    /* Disclaimer footer */
    footer {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 6px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🏥</div>
  <div>
    <h1>VinmecPrep AI</h1>
    <p>Trợ lý chuẩn bị khám – Không thay thế bác sĩ</p>
  </div>
</header>

<div id="chat-container">
  <div id="messages"></div>

  <div id="quick-prompts">
    <button class="qp-btn" onclick="sendQuick('Tôi cần khám tim mạch, cần chuẩn bị gì?')">❤️ Khám tim mạch</button>
    <button class="qp-btn" onclick="sendQuick('Xét nghiệm máu tổng quát cần nhịn ăn không?')">🩸 Xét nghiệm máu</button>
    <button class="qp-btn" onclick="sendQuick('Khám sản phụ khoa lần đầu cần giấy tờ gì?')">🤰 Sản phụ khoa</button>
    <button class="qp-btn" onclick="sendQuick('Nội soi dạ dày tại Vinmec cần chuẩn bị gì?')">🔬 Nội soi dạ dày</button>
    <button class="qp-btn" onclick="sendQuick('Khám nhi cho trẻ 2 tuổi cần mang gì?')">👶 Khám nhi</button>
  </div>

  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="Nhập câu hỏi về khám bệnh tại Vinmec..."
              onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Gửi">➤</button>
  </div>
</div>

<footer>⚠️ Thông tin tham khảo. Gọi <strong>1900 54 61 54</strong> để xác nhận.</footer>

<script>
  const API_URL = '/api';
  let sessionId = null;
  let history = [];
  let isLoading = false;

  // Welcome message
  window.onload = () => {
    addBotMessage(
      "Xin chào! Tôi là **VinmecPrep AI** 👋\n\n" +
      "Tôi có thể giúp bạn:\n" +
      "• Biết cần **nhịn ăn** bao lâu trước khi khám\n" +
      "• Chuẩn bị **giấy tờ** gì cần mang\n" +
      "• Hướng dẫn **đặt lịch** và thời gian dự kiến\n\n" +
      "Bạn cần khám chuyên khoa gì hoặc làm xét nghiệm gì?"
    );
  };

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function sendQuick(text) {
    document.getElementById('user-input').value = text;
    sendMessage();
  }

  function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    addUserMessage(text);
    input.value = '';
    input.style.height = 'auto';
    showTyping();

    fetch(`${API_URL}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message:    text,
        session_id: sessionId,
        history:    history.slice(-20),
      }),
    })
    .then(r => r.json())
    .then(data => {
      hideTyping();
      sessionId = data.session_id;

      if (!data.blocked) {
        history.push({ role: 'user',      content: text });
        history.push({ role: 'assistant', content: data.reply });
      }

      addBotMessage(data.reply);
    })
    .catch(err => {
      hideTyping();
      addBotMessage('⚠️ Đã xảy ra lỗi kết nối. Vui lòng thử lại hoặc gọi **1900 54 61 54**.');
      console.error(err);
    });
  }

  function addUserMessage(text) {
    const row = createBubble('user', '🧑', text);
    document.getElementById('messages').appendChild(row);
    scrollBottom();
  }

  function addBotMessage(text) {
    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    const row = createBubble('bot', '🏥', renderMarkdown(text));
    document.getElementById('messages').appendChild(row);
    scrollBottom();
  }

  function createBubble(type, avatarEmoji, contentHtml) {
    const row = document.createElement('div');
    row.className = `bubble-row ${type}`;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = avatarEmoji;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (type === 'bot') bubble.innerHTML = contentHtml;
    else bubble.textContent = contentHtml;
    row.appendChild(avatar);
    row.appendChild(bubble);
    return row;
  }

  // Minimal markdown renderer
  function renderMarkdown(text) {
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }

  let typingEl = null;
  function showTyping() {
    isLoading = true;
    document.getElementById('send-btn').disabled = true;
    const row = document.createElement('div');
    row.className = 'bubble-row bot';
    row.id = 'typing-indicator';
    row.innerHTML = '<div class="avatar">🏥</div><div class="bubble typing"><span></span><span></span><span></span></div>';
    document.getElementById('messages').appendChild(row);
    scrollBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function scrollBottom() {
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
  }
</script>
</body>
</html>
